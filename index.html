function focusOn(body,surface=false){body.getWorldPosition(world);const direction=camera.position.clone().sub(controls.target).normalize();const radius=body.userData.r||4,dist=surface?radius*1.18:Math.max(radius*7,30);flight={body,surface,t:0,startCam:camera.position.clone(),startTarget:controls.target.clone(),offset:direction.multiplyScalar(dist)};follow=null;landed=false;controls.enabled=false;controls.minDistance=radius*1.08;planets.forEach(m=>{const label=m.children.find(child=>child.isSprite);if(label)label.material.opacity=0});ui.landing.classList.remove('show');ui.target.innerHTML='航行至 <b>'+body.userData.name+'</b>'}
renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();const b=pick(e);if(b)show(b)});renderer.domElement.addEventListener('dblclick',e=>{const b=pick(e);if(b){show(b);focusOn(b)}});renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};ui.intro.classList.add('hide')});renderer.domElement.addEventListener('pointerup',e=>{if(e.button!==0||Math.hypot(e.clientX-down.x,e.clientY-down.y)>4||pick(e))return;mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();if(ray.ray.intersectPlane(plane,hit)){follow=null;controls.minDistance=2;controls.target.copy(hit)}});
ui.focus.onclick=()=>{if(selected){focusOn(selected);ui.card.classList.remove('show')}};ui.surface.onclick=()=>{if(selected){focusOn(selected,true);ui.card.classList.remove('show')}};ui.close.onclick=()=>ui.card.classList.remove('show');ui.home.onclick=()=>{follow=null;flight=null;landed=false;controls.enabled=true;controls.minDistance=2;camera.position.set(0,170,360);controls.target.set(0,0,0);ui.target.innerHTML='观测中心 <b>太阳系</b>';selectionHalo.visible=false;planets.forEach(m=>{const label=m.children.find(child=>child.isSprite);if(label)label.material.opacity=1});document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'));ui.landing.classList.remove('show')};ui.orbits.onclick=()=>{orbitLines.visible=!orbitLines.visible;ui.orbits.textContent=orbitLines.visible?'隐藏轨道':'显示轨道'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),odt=isPaused?0:dt*simSpeed;specs.forEach((s,i)=>{const m=planets[i];m.userData.pivot.rotation.y+=odt*(1.65/Math.sqrt(s.days));m.rotation.y+=odt*.18;if(m.userData.clouds)m.userData.clouds.rotation.y+=odt*.05});if(moonPivot)moonPivot.rotation.y+=odt*.12;sun.rotation.y+=odt*.025;sky.rotation.y+=dt*.0007;asteroidBelt.rotation.y+=odt*.003;if(flight){flight.body.getWorldPosition(world);flight.t=Math.min(1,flight.t+dt/.95);const e=1-Math.pow(1-flight.t,3),destination=world.clone().add(flight.offset);camera.position.lerpVectors(flight.startCam,destination,e);controls.target.lerpVectors(flight.startTarget,world,e);if(flight.t===1){follow=flight.body;lastFollowPos.copy(world);controls.enabled=true;if(flight.surface){landed=true;ui.landing.textContent='已抵达 '+flight.body.userData.name+' 近地表';ui.landing.classList.add('show')}ui.target.innerHTML='观测目标 <b>'+flight.body.userData.name+'</b>';flight=null}}else if(follow){follow.getWorldPosition(world);delta.copy(world).sub(lastFollowPos);camera.position.add(delta);controls.target.add(delta);lastFollowPos.copy(world);const surface=follow.userData.r||4,dist=camera.position.distanceTo(world);if(dist<surface*1.35&&!landed){landed=true;ui.landing.textContent='已进入 '+follow.userData.name+' 近地表视角';ui.landing.classList.add('show')}else if(dist>surface*1.8&&landed){landed=false;ui.landing.classList.remove('show')}}planets.forEach(m=>{const label=m.children.find(child=>child.isSprite);if(label){m.getWorldPosition(delta);label.visible=camera.position.distanceTo(delta)>Math.max(52,(m.userData.r||4)*11)}});if(selectionHalo.visible&&selectionHalo.userData.target){selectionHalo.userData.target.getWorldPosition(world);selectionHalo.position.copy(world);selectionHalo.scale.setScalar((selectionHalo.userData.target.userData.r||4)*1.28);selectionHalo.rotation.y+=dt*.22}controls.update();renderer.render(scene,camera);ui.telemetry.innerHTML='视距 <b>'+camera.position.distanceTo(controls.target).toFixed(1)+'</b><br>模拟 <b>'+(isPaused?'已暂停':simSpeed+'×')+'</b>'}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
